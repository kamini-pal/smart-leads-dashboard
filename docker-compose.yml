# Smart Leads Dashboard — Docker Compose
#
# Starts 3 containers:
#   mongo    → MongoDB database
#   backend  → Express API (port 5000)
#   frontend → React app + Nginx (port 3000)
#
# Usage:
#   cp .env.example .env
#   docker compose up --build

services:
  mongo:
    image: mongo:7
    container_name: smartleads-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartleads-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/smart-leads-dashboard
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: smartleads-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
